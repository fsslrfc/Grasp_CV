<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grasp 视觉操作台</title>
  <link rel="stylesheet" href="/static/style.css?v=10">
</head>
<body>
  <div id="app">
    <div class="stream-card shared-stream-card">
      <div class="stream-stage">
        <img id="main-stream" alt="实时视频流" onclick="onMainImageClick(event)">
        <div id="place-point-marker" class="place-point-marker"></div>
      </div>
    </div>

    <div id="calibration-screen" class="screen active">
      <div id="calibration-status" class="info-box">请先完成四点标定</div>

      <div id="calibration-controls">
        <div id="cal-card-0" class="calibration-card">
          <div class="card-title">左上</div>
          <div class="coord-fields">
            <label>
              <input id="robot-x-0" type="number" step="0.01" placeholder="X" onchange="updateCalibrationRobotPoint(0)">
            </label>
            <label>
              <input id="robot-y-0" type="number" step="0.01" placeholder="Y" onchange="updateCalibrationRobotPoint(0)">
            </label>
          </div>
          <button id="mark-btn-0" class="mark-btn pending" type="button" onclick="armCalibrationPoint(0)">标定坐标</button>
          <div id="pixel-info-0" class="pixel-info">像素: 未标定</div>
        </div>

        <div id="cal-card-1" class="calibration-card">
          <div class="card-title">右上</div>
          <div class="coord-fields">
            <label>
              <input id="robot-x-1" type="number" step="0.01" placeholder="X" onchange="updateCalibrationRobotPoint(1)">
            </label>
            <label>
              <input id="robot-y-1" type="number" step="0.01" placeholder="Y" onchange="updateCalibrationRobotPoint(1)">
            </label>
          </div>
          <button id="mark-btn-1" class="mark-btn pending" type="button" onclick="armCalibrationPoint(1)">标定坐标</button>
          <div id="pixel-info-1" class="pixel-info">像素: 未标定</div>
        </div>

        <div id="cal-card-2" class="calibration-card">
          <div class="card-title">右下</div>
          <div class="coord-fields">
            <label>
              <input id="robot-x-2" type="number" step="0.01" placeholder="X" onchange="updateCalibrationRobotPoint(2)">
            </label>
            <label>
              <input id="robot-y-2" type="number" step="0.01" placeholder="Y" onchange="updateCalibrationRobotPoint(2)">
            </label>
          </div>
          <button id="mark-btn-2" class="mark-btn pending" type="button" onclick="armCalibrationPoint(2)">标定坐标</button>
          <div id="pixel-info-2" class="pixel-info">像素: 未标定</div>
        </div>

        <div id="cal-card-3" class="calibration-card">
          <div class="card-title">左下</div>
          <div class="coord-fields">
            <label>
              <input id="robot-x-3" type="number" step="0.01" placeholder="X" onchange="updateCalibrationRobotPoint(3)">
            </label>
            <label>
              <input id="robot-y-3" type="number" step="0.01" placeholder="Y" onchange="updateCalibrationRobotPoint(3)">
            </label>
          </div>
          <button id="mark-btn-3" class="mark-btn pending" type="button" onclick="armCalibrationPoint(3)">标定坐标</button>
          <div id="pixel-info-3" class="pixel-info">像素: 未标定</div>
        </div>
      </div>

      <button id="calibration-complete-btn" type="button" disabled onclick="completeCalibration()">标定完成</button>
    </div>

    <div id="operate-screen" class="screen">
      <div class="operate-bottom-panel">
        <div class="target-strip-section">
          <div class="section-title-row">
            <h2>可抓取目标
              <span class="target-strip-hint">左右滑动查看目标</span>
            </h2>
          </div>
          <div id="target-list" class="target-strip">等待检测结果...</div>
        </div>
        <div class="operate-summary">
          <div id="status" class="info-box">状态：等待连接</div>
          <div id="operation-mode" class="info-box locked">当前模式：抓取模式，点击上方画面或下方列表锁定目标</div>
          <div class="operation-actions">
            <button id="place-mode-btn" type="button" onclick="enterPlaceMode()">进入放置模式</button>
            <button id="cancel-place-btn" type="button" disabled onclick="cancelPlaceMode()">退出放置模式</button>
            <button id="grasp-btn" type="button" disabled onclick="sendGrasp()">发送抓取坐标</button>
          </div>
          <div id="fps"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="/static/app.js?v=10"></script>
</body>
</html>
